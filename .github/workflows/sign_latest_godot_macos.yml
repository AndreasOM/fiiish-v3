name: 🖥️ macOS - 🖋️ Sign
run-name: 🖥️ macOS - 🖋️ Sign ${{ vars.PROJECT }} - ${{ inputs.build_type }} by @${{ github.actor }}

# Developer ID signs, notarizes and staples the latest macOS build of a type.
#
# Reads s3://artifacts.omnimad.net/<project>/<project>-<build_type>-latest.txt,
# downloads that archive, and uploads <archive>-signed.tgz next to it with the
# same layout.
#
# Signing goes inside out, without --deep: every Mach-O in Frameworks, then
# every framework, then the app. All with the hardened runtime and a secure
# timestamp. The app gets macos/fiiish.entitlements (what the Steam overlay
# needs). The timestamp server fails now and then, so each codesign gets a
# second try after a minute.
#
# Needs: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, APPLE_DEVELOPER_ID_CERT(_PASSWORD),
# APP_STORE_API_PRIVATE_KEY, APPSTORE_API_KEY_ID, APPSTORE_ISSUER_ID.
# verify_setup.yaml checks the Apple ones on Linux.

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'The type of build'
        required: true
        default: 'macos'
        type: choice
        options:
          - 'macos'
          - 'macos-classic'
          - 'macos-demo-classic'
  workflow_call:
    inputs:
      build_type:
        description: 'The type of build'
        default: 'macos'
        required: false
        type: string
      summary_style:
        description: 'The style for the summary'
        default: 'full'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sign-${{ inputs.build_type }}
  cancel-in-progress: false

env:
  PROJECT: ${{ vars.PROJECT }}
  BUILD_TYPE: ${{ inputs.build_type }}
  SUMMARY_STYLE: ${{ inputs.summary_style }}
  BUCKET: artifacts.omnimad.net
  AWS_DEFAULT_REGION: eu-west-1
  TEAM_ID: ACWF5Y4FTA

jobs:
  sign:
    name: Sign and notarize
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Download the latest build
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          case "$BUILD_TYPE" in
            # as BINARY_NAME in build.yaml: every *-classic is fiiish-classic
            macos-classic|macos-demo-classic) app_name="fiiish-classic.app" ;;
            macos)                            app_name="fiiish-v3.app" ;;
            *) echo "unsupported build type: $BUILD_TYPE" >&2; exit 1 ;;
          esac
          aws s3 cp --no-progress "s3://$BUCKET/$PROJECT/$PROJECT-$BUILD_TYPE-latest.txt" latest.txt
          key="$(cat latest.txt)"   # <project>/<date>/<project>-<type>-<date>.tgz
          case "$key" in "$PROJECT"/*/"$PROJECT-$BUILD_TYPE"-*.tgz) ;; *) echo "bad pointer: $key" >&2; exit 1 ;; esac
          aws s3 cp --no-progress "s3://$BUCKET/$key" build.tgz
          tar -xzf build.tgz
          app="$PWD/$PROJECT-$BUILD_TYPE/$app_name"
          [ -d "$app" ] || { echo "no $app_name in $key" >&2; exit 1; }
          xattr -cr "$app"   # codesign refuses extended attributes ("detritus")
          {
            echo "KEY=$key"
            echo "SIGNED_KEY=${key%.tgz}-signed.tgz"
            echo "APP=$app"
          } >> "$GITHUB_ENV"

      - name: Throwaway keychain with the Developer ID certificate
        env:
          APPLE_DEVELOPER_ID_CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERT }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/sign.keychain-db"
          kc_pass="$(openssl rand -hex 32)"
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          printf '%s' "$APPLE_DEVELOPER_ID_CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_DEVELOPER_ID_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$kc" >/dev/null
          # codesign looks identities up in the search list.
          old="$(security list-keychains -d user | tr -d '"' | xargs)"
          # shellcheck disable=SC2086 # one path per word
          security list-keychains -d user -s "$kc" $old
          identity="$(security find-identity -v -p codesigning "$kc" \
            | awk -v team="($TEAM_ID)" '/"Developer ID Application:/ && index($0, team) { print $2; exit }')"
          [ -n "$identity" ] || { echo "no Developer ID Application identity of $TEAM_ID" >&2; security find-identity -v -p codesigning "$kc"; exit 1; }
          security find-identity -v -p codesigning "$kc" | grep "$identity"
          {
            echo "KEYCHAIN=$kc"
            echo "IDENTITY=$identity"
          } >> "$GITHUB_ENV"

      - name: Check out the entitlements
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          sparse-checkout: |
            macos/fiiish.entitlements
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Sign (inside out)
        run: |
          set -euo pipefail
          ent="$PWD/src/macos/fiiish.entitlements"
          plutil -lint "$ent"
          sign() {
            local try
            for try in 1 2; do
              if codesign --force --verbose --timestamp --options runtime \
                   --keychain "$KEYCHAIN" --sign "$IDENTITY" "$@"; then
                return 0
              fi
              [ "$try" = 2 ] || { echo "codesign failed for ${*: -1}, retrying in 60 s" >&2; sleep 60; }
            done
            return 1
          }
          fw="$APP/Contents/Frameworks"
          if [ -d "$fw" ]; then
            # Every Mach-O, whatever its name (a framework's main binary has no
            # .dylib extension), deepest first, then the frameworks around them.
            while IFS= read -r f; do
              if file -b "$f" | grep -q '^Mach-O'; then sign "$f"; fi
            done < <(find "$fw" -type f | awk '{ print gsub("/", "/"), $0 }' | sort -rn | cut -d' ' -f2-)
            while IFS= read -r f; do sign "$f"; done < <(find "$fw" -type d -name '*.framework' -prune)
          fi
          sign --entitlements "$ent" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E '^(Authority|TeamIdentifier|Timestamp|Runtime|Identifier)'
          codesign -d --entitlements - "$APP"

      - name: Notarize and staple
        env:
          APP_STORE_API_PRIVATE_KEY: ${{ secrets.APP_STORE_API_PRIVATE_KEY }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          p8="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APP_STORE_API_PRIVATE_KEY" | base64 --decode > "$p8"
          auth=(--key "$p8" --key-id "$APPSTORE_API_KEY_ID" --issuer "$APPSTORE_ISSUER_ID")
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/app.zip"
          xcrun notarytool submit "$RUNNER_TEMP/app.zip" "${auth[@]}" \
            --wait --timeout 30m --output-format json > notary.json || true
          cat notary.json
          id="$(plutil -extract id raw -o - notary.json 2>/dev/null || true)"
          status="$(plutil -extract status raw -o - notary.json 2>/dev/null || true)"
          if [ -n "$id" ]; then
            xcrun notarytool log "$id" "${auth[@]}" notary-log.json || true
            cat notary-log.json 2>/dev/null || true
          fi
          rm -f "$p8"
          echo "NOTARY_ID=$id" >> "$GITHUB_ENV"
          [ "$status" = Accepted ] || { echo "notarization: ${status:-no result}" >&2; exit 1; }
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"

      - name: Archive and upload to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          archive="$(basename "$SIGNED_KEY")"
          COPYFILE_DISABLE=1 tar -czf "$archive" "$PROJECT-$BUILD_TYPE"
          aws s3 cp --no-progress "$archive" "s3://$BUCKET/$SIGNED_KEY"
          echo "ARCHIVE_SIZE=$(du -h "$archive" | cut -f1)" >> "$GITHUB_ENV"

      - name: Create Summary
        if: always()
        run: |
          if [[ "$SUMMARY_STYLE" == "skip" ]]; then
            echo "Skipping summary"
          elif [[ "$SUMMARY_STYLE" == "minimal" ]]; then
            {
              echo "|                        |                                   |"
              echo "| :--------------------- | --------------------------------: |"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            version="$(cat "$PROJECT-$BUILD_TYPE/version.txt" 2>/dev/null || echo '?')"
            {
              echo "### $PROJECT $BUILD_TYPE, signed and notarized"
              echo "| | |"
              echo "|---|---|"
              echo "| version | \`$version\` |"
              echo "| from | \`s3://$BUCKET/${KEY:-?}\` |"
              echo "| archive | \`s3://$BUCKET/${SIGNED_KEY:-?}\` |"
              echo "| notary submission | \`${NOTARY_ID:-none}\` |"
              echo "| size | ${ARCHIVE_SIZE:-?} |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove the keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8"
