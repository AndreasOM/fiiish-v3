name: 🚂 Push latest to steam
run-name: 🚂 Push latest to steam ${{ vars.PROJECT }} - ${{ inputs.sub_type }} by @${{ github.actor }}
on: 
  workflow_dispatch:
    inputs:
      sub_type:
        description: 'The sub_type of build'
        required: true
        default: 'classic'
        type: choice
        options:
          - 'classic'
          - 'demo-classic'
  workflow_call:
    inputs:
      sub_type:
        description: 'The sub_type of build'
        required: true
        type: string
      summary_style:
        description: 'The style for the summary'
        default: 'full'
        required: false
        type: string

jobs:
  push:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Use bash shells on all platforms.
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/helpers
            steam/templates
          fetch-depth: 1
#          submodules: true

      - name: Create variables
        run: |
          PROJECT=${{ vars.PROJECT }}
          SUB_TYPE=${{ inputs.sub_type }}
          TARGET_FOLDER="temp-steam"

          #
          # put into github env
          #
          {
            echo "PROJECT=${PROJECT}"
            echo "SUB_TYPE=${SUB_TYPE}"
            echo "TARGET_FOLDER=${TARGET_FOLDER}"
          } >> "$GITHUB_ENV"

      - name: Setup steamcmd
        uses: CyberAndrii/setup-steamcmd@afc45f145b95c175c3a3862d3ca84756537d48e8 # v1

      - name: Bootstrap steamcmd
        run: |
          which steamcmd
          steamcmd +quit

      # Token cached by steam_refresh_login. Missing or expired: Steam Guard asks the phone.
      - name: Restore steam token
        uses: actions/cache/restore@v6
        with:
          path: steam-token.enc
          key: steam-token-${{ github.run_id }}
          restore-keys: |
            steam-token-

      - name: Install steam token
        env:
          STEAM_CACHE_KEY: ${{ secrets.STEAM_CACHE_KEY }}
        run: |
          .github/helpers/steam_token.sh restore steam-token.enc

      # Early: fail before the downloads, and a Steam Guard fallback prompt comes right at the start.
      - name: Login to steam
        env:
          STEAM_USER: ${{ secrets.STEAM_USER }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
        run: |
          .github/helpers/steam_login.sh

      - name: Download latest linux from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "eu-west-1"
        run: |
          .github/helpers/download_latest.sh ${{ env.TARGET_FOLDER }} linux-${{ env.SUB_TYPE }}

      - name: Download latest signed macos from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "eu-west-1"
        run: |
          # Signed and notarized only: Steam has "App Bundles Are Notarized" ticked.
          .github/helpers/download_latest.sh ${{ env.TARGET_FOLDER }} macos-${{ env.SUB_TYPE }} signed

      - name: Download latest windows from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "eu-west-1"
        run: |
          .github/helpers/download_latest.sh ${{ env.TARGET_FOLDER }} windows-${{ env.SUB_TYPE }}

      - name: Create .VDFs
        run: |
          .github/helpers/steam_create_vdf.sh ${{ env.TARGET_FOLDER }} ${{ env.SUB_TYPE }}

      - name: Upload to steam
        env:
          STEAM_USER: ${{ secrets.STEAM_USER }}
        run: |
          cd "${TARGET_FOLDER}"
          CWD=$(pwd)
          cd -
          # Username only: reuses the token from the login step.
          steamcmd +login "${STEAM_USER}" +run_app_build "${CWD}/AppBuild_${{ env.SUB_TYPE }}.vdf" +quit

      - name: Create Summary
        if: always()
        run: |
          echo "Summary Style: '${{ inputs.summary_style }}'"
          if [[ "${{ inputs.summary_style }}" == "skip" ]]
          then
            echo "Skipping summary"
          elif [[ "${{ inputs.summary_style }}" == "minimal" ]]
          then
            {
              echo "|                        |                                   |"
              echo "| :--------------------- | --------------------------------: |"
              echo "| VERSION                | ${{ env.VERSION }}                |"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "|                        |                                   |"
              echo "| :--------------------- | --------------------------------: |"
              echo "| macos_VERSION          | ${{ env.macos_VERSION }}          |"
              echo "| linux_VERSION          | ${{ env.linux_VERSION }}          |"
              echo "| windows_VERSION        | ${{ env.windows_VERSION }}        |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
